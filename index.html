<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prep verduras">
<meta name="theme-color" content="#f7f2e8">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>Prep de verduras</title>
<style>
:root{
  --bg:#f7f2e8;--card:#fffdf8;--ink:#2b2a26;--muted:#7a7568;--line:#e6dfcf;
  --green:#4d6a3a;--green-soft:#e3ecd8;--terra:#b9552d;--terra-soft:#f6e1d6;
  --amber:#8a6510;--amber-soft:#f5ebc8;--shadow:0 1px 2px rgba(60,50,30,.06),0 4px 14px rgba(60,50,30,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1a1c17;--card:#23261f;--ink:#efeadc;--muted:#a49f90;--line:#34382d;
    --green:#a9c78f;--green-soft:#2c3a22;--terra:#e59a78;--terra-soft:#3d2a20;
    --amber:#e3c06a;--amber-soft:#3a3118;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1,h2,h3{font-family:ui-serif,Georgia,"Times New Roman",serif;font-weight:600;margin:0}
h1{font-size:26px;letter-spacing:-.01em}
h2{font-size:19px;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.seg{display:flex;gap:6px;margin:14px 0 4px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 8px;border-radius:12px;font:inherit;font-size:14px}
.seg button.on{background:var(--green);border-color:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#14170f}}
.seg.sm{margin:8px 0 0}
.seg.sm button{padding:6px 8px;font-size:13px;border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.b{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;margin:0 4px 4px 0}
.b2{background:var(--green-soft);color:var(--green)}
.b1{background:var(--amber-soft);color:var(--amber)}
.b0{background:var(--terra-soft);color:var(--terra)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:12px;font:inherit;font-size:15px}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#14170f}}
.dice{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;line-height:1}
select,input[type=number]{font:inherit;font-size:16px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.muted{color:var(--muted);font-size:14px}
.slot{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:13px 0;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.slot .sl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.slot .sn{font-family:ui-serif,Georgia,serif;font-size:22px;line-height:1.15;margin:2px 0 6px}
.slot select{margin-top:8px;font-size:15px;padding:7px 9px}
.slot .dd{font-size:14px;color:var(--muted)}
.tup{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tup:first-of-type{border-top:0}
.tup .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:700}
.tup .g{margin-left:auto;text-align:right;font-weight:600;white-space:nowrap}
.tup .d{color:var(--muted);font-size:14px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--green);flex:none}
.chk .t{font-weight:600}
.chk.done .t,.chk.done .d{text-decoration:line-through;color:var(--muted)}
.chk .q{margin-left:auto;text-align:right;white-space:nowrap;font-weight:600}
.chk .d{font-size:13px;color:var(--muted)}
.grp{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 2px;font-weight:700}
.grp:first-child{margin-top:0}
.plate{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:10px 0 8px;border:1px solid var(--line)}
.plate i{display:block}
.fld{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.fld:first-of-type{border-top:0}
.warn{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
nav .in{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;padding:8px 0;border-radius:12px}
nav button .ic{display:block;font-size:20px;line-height:1.1}
nav button.on{color:var(--green);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const PV=(function(){
'use strict';
const STORE_KEY='pv_verduras_v1';
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MCORTO=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
// Temporadas para Argentina (zona central), 12 dígitos de enero a diciembre.
// 2 = de estación, 1 = empieza o termina, 0 = fuera de estación.
// Tomate, berenjena, morrón, espinaca, acelga, lechuga, zanahoria y cebolla: tabla de Frutto (zona central).
// Zucchini (zapallito) y remolacha: calendario de Agro Rural Noticias. Brócoli, chauchas, espárragos,
// coliflor y champiñón: estimados (las fuentes no los traen o se contradicen). Editá estas líneas si hace falta.
const M=s=>s.split('').map(Number);
const U1=['unidad','unidades'],UP=['planta','plantas'],UA=['atado','atados'];
const VEG={
  zucchini:{nombre:'Zucchini',u:U1,modo:'peso',paso:50,unitG:250,rinde:.70,temp:M('222222001222')},
  berenjena:{nombre:'Berenjena',u:U1,modo:'peso',paso:50,unitG:300,rinde:.70,temp:M('222100001222')},
  cebolla:{nombre:'Cebolla',u:U1,modo:'peso',paso:50,unitG:150,rinde:.65,temp:M('222210001222')},
  zanahoria:{nombre:'Zanahoria',u:U1,modo:'peso',paso:50,unitG:120,rinde:.85,temp:M('222222101222')},
  morron:{nombre:'Morrón',u:U1,modo:'peso',paso:50,unitG:200,rinde:.75,temp:M('222100001222')},
  coliflor:{nombre:'Coliflor',u:UP,modo:'unidad',unitG:800,rinde:.50,temp:M('001222221000')},
  remolacha:{nombre:'Remolacha',u:U1,modo:'peso',paso:50,unitG:150,rinde:.75,temp:M('222222001222')},
  champinon:{nombre:'Champiñones',modo:'peso',paso:50,rinde:.55,temp:M('222222222222')},
  lechuga:{nombre:'Lechuga',u:UP,modo:'unidad',unitG:300,rinde:.80,temp:M('222221001222')},
  tomate:{nombre:'Tomate',u:U1,modo:'peso',paso:50,unitG:150,rinde:.95,temp:M('222100001222')},
  chauchas:{nombre:'Chauchas',nombreCong:'Chauchas congeladas',modo:'peso',paso:100,rinde:.90,rindeCong:.92,congelable:true,temp:M('222100000122'),
    cocina:['Despuntar las chauchas y hervirlas 6–8 min en agua con sal.','Pasarlas por agua con hielo para cortar la cocción (quedan verdes y firmes) y escurrir bien.'],
    cocinaCong:['Cocinarlas directo del freezer, sin descongelar: 4–5 min hervidas en agua con sal, o salteadas unos 6–8 min.','Escurrir bien y dejar enfriar antes de tapar.']},
  espinaca:{nombre:'Espinaca',nombreCong:'Espinaca congelada',u:UA,modo:'unidad',unitG:350,rinde:.40,rindeCong:.65,congelable:true,temp:M('221000012222'),
    cocina:['Lavar bien y blanquear 1–2 min en agua hirviendo, o saltear en sartén hasta que suelte el agua.','Escurrir y exprimir muy bien: con agua de más, el tupper dura menos.'],
    cocinaCong:['Descongelar en la heladera la noche anterior, o ponerla directo en una sartén a fuego medio hasta que suelte el agua (3–5 min).','Exprimir muy bien: la espinaca congelada suelta mucha agua.']},
  esparragos:{nombre:'Espárragos',u:UA,modo:'unidad',unitG:300,rinde:.55,congelable:false,temp:M('000000012221'),
    nota:'Temporada corta: termina hacia mediados de noviembre. Solo se compran frescos.',notaMeses:[8,9,10],
    cocina:['Cortar la base leñosa (unos 2–3 cm).','Cocinarlos 4–6 min en sartén, o al horno junto con la bandeja, según el grosor: tiernos pero firmes.']},
  brocoli:{nombre:'Brócoli',nombreCong:'Brócoli congelado',u:UP,modo:'unidad',unitG:450,rinde:.65,rindeCong:.90,congelable:true,temp:M('001222222210'),
    cocina:['Separar en ramitos parejos y pelar el tronco.','Al vapor o hervido 4–5 min; escurrir y dejar que se seque con el calor propio.'],
    cocinaCong:['Cocinarlo directo del freezer al vapor 4–6 min (o hervido 3–4 min).','Escurrir y dejar que se seque con el calor propio.']},
  acelga:{nombre:'Acelga',nombreCong:'Acelga congelada',u:UA,modo:'unidad',unitG:600,rinde:.55,rindeCong:.70,congelable:true,temp:M('222222222222'),
    cocina:['Separar las pencas de las hojas y cortarlas por separado.','Hervir o saltear las pencas 4–5 min, sumar las hojas 2 min más; escurrir y exprimir bien.'],
    cocinaCong:['Cocinarla directo del freezer, 4–5 min en sartén o en agua hirviendo.','Escurrir y exprimir bien.']}
};
// Pool de verduras para la bandeja del horno (peso relativo dentro de la bandeja). Sin almidonadas (papa, batata, zapallo, choclo).
const HORNO_POOL={zucchini:1,berenjena:1,cebolla:.5,zanahoria:1,morron:1,coliflor:1,remolacha:1,champinon:.8};
const HORNO_N=4;
const SALADS={
  zanahoria:{nombre:'Lechuga + zanahoria',key:'zanahoria',mix:{lechuga:.70,zanahoria:.30},tupper:'lechuga lavada y seca + zanahoria rallada'},
  tomate:{nombre:'Lechuga + tomate',key:'tomate',mix:{lechuga:.65,tomate:.35},tupper:'lechuga lavada y seca (el tomate va entero y se corta al servir)'}
};
const GREENS=['chauchas','espinaca','esparragos','brocoli','acelga'];
const ADEREZOS=[
  {n:'Limón y mostaza',d:'Jugo de ½ limón, 1 cdita de mostaza, sal, pimienta y 1 cdita de aceite. Mezclar en un frasco.'},
  {n:'Vinagre y orégano',d:'1 cda de vinagre de manzana (o balsámico), orégano, sal y 1 cdita de aceite.'},
  {n:'Limón, ajo y perejil',d:'Jugo de ½ limón, un toque de ajo rallado, perejil picado, sal y 1 cdita de aceite.'},
  {n:'Soja y limón',d:'1 cdita de salsa de soja, jugo de ½ limón y sésamo por arriba. Poca sal extra: la soja ya es salada.'},
  {n:'Pimentón y limón',d:'Jugo de ½ limón, pimentón ahumado, una pizca de comino y 1 cdita de aceite.'}
];
const CONDIMENTOS=[
  {n:'Pimentón y ajo en polvo',d:'Pimentón dulce, ajo en polvo, sal y pimienta.'},
  {n:'Hierbas provenzales',d:'Orégano, tomillo, romero, sal y pimienta.'},
  {n:'Comino y pimentón ahumado',d:'Comino, pimentón ahumado y sal.'},
  {n:'Curry suave',d:'Curry suave y cúrcuma, sal. Un chorrito de limón al sacarlas del horno.'},
  {n:'Limón y pimienta',d:'Ralladura de limón, pimienta negra y sal; jugo de limón al sacarlas.'}
];
// Tipos de plato: qué tuppers entran en cada comida. Si lleva más de uno, la verdura se reparte en partes iguales.
const PLATOS=[
  {id:'h',nombre:'Solo horno',c:['asado']},
  {id:'e',nombre:'Solo ensalada',c:['ensalada']},
  {id:'v',nombre:'Solo verde',c:['verde']},
  {id:'hv',nombre:'Horno + verde',c:['asado','verde']},
  {id:'he',nombre:'Horno + ensalada',c:['asado','ensalada']},
  {id:'ev',nombre:'Ensalada + verde',c:['ensalada','verde']},
  {id:'hev',nombre:'Los tres',c:['asado','ensalada','verde']}
];
// Comidas por semana de cada tipo (para 14 comidas). Se reescala solo si cambiás personas, comidas o días.
const DEFAULTS=()=>({personas:1,comidas:2,dias:7,gPlato:200,platos:{h:3,e:4,v:3,hv:2,he:1,ev:1,hev:0},fuera:false,verdeFormato:'congelado',bolsaG:400,merDias:7});

/* ---------- Merienda (sin cocinar) ----------
   Estructura del plan de Luli: hidrato complejo + proteína + fibra. Filtro de candidiasis: sin azúcar,
   sin fiambres ni ultraprocesados; la fruta va en la merienda. Pan, quesos, ricota y hummus: reducidos (a confirmar).
   Porciones de Luli: 1 rebanada de pan, 2 cdas de avena, 1 cda de ricota, 1 yogur, 1 fruta mediana.
   Estimadas (Luli no las indica): cherry ~100 g, hummus ~50 g y frutos rojos ~80 g por merienda. */
const MER={
  tostada:{nombre:'Tostada con ricota y tomate',tipo:'salada',como:'1 rebanada de pan de masa madre tostada + ricota (o queso) + tomates cherry + orégano.',ing:{pan:1,ricota:1,cherry:100,oregano:0}},
  hummus:{nombre:'Hummus con cherry y tostada',tipo:'salada',como:'Hummus + tomates cherry para mojar + 1 tostada de masa madre (o el hummus untado arriba de la tostada).',ing:{hummus:50,cherry:100,pan:1}},
  yogur:{nombre:'Yogur con avena y fruta',tipo:'dulce',como:'Yogur natural sin azúcar + 1 bolsita de avena + la fruta de la semana.',ing:{yogur:1,avena:2,FRUTA:1}},
  placa:{nombre:'Yogur helado en placa',tipo:'dulce',como:'Trozos de la placa del freezer (yogur + frutos rojos + avena). Sacala 5 min antes.',ing:{yogur:1,avena:2,frutosrojos:80}},
  manzana:{nombre:'Manzana con ricota y canela',tipo:'dulce',como:'Rodajas gruesas de manzana verde + 1 cda de ricota + canela + avena espolvoreada.',ing:{manzana:1,ricota:1,avena:2,canela:0}}
};
const MER_IDS=Object.keys(MER);
const MER_N=3;
// Fruta de la semana para el yogur (las mejor toleradas según los lineamientos de candidiasis).
const FRUTAS={kiwi:'Kiwi',pera:'Pera',manzana:'Manzana verde',frutosrojos:'Frutos rojos'};
const FRUTA_IDS=Object.keys(FRUTAS);
// grp: 'merienda' = comprar · 'merienda-d' = suele estar en casa, revisar.
const MING={
  yogur:{n:'Yogur natural sin azúcar',grp:'merienda',u:['pote','potes'],aprox:'potes individuales',nota:'que diga "sin azúcar"'},
  hummus:{n:'Hummus',grp:'merienda',g:true,pote:200,nota:'sin azúcar: revisá la etiqueta'},
  cherry:{n:'Tomates cherry',grp:'merienda',g:true,paso:50},
  frutosrojos:{n:'Frutos rojos congelados',grp:'merienda',g:true,bolsa:true,nota:'lo que sobra queda en el freezer'},
  kiwi:{n:'Kiwi',grp:'merienda',u:['unidad','unidades']},
  pera:{n:'Pera',grp:'merienda',u:['unidad','unidades']},
  manzana:{n:'Manzana verde',grp:'merienda',u:['unidad','unidades']},
  pan:{n:'Pan de masa madre',grp:'merienda-d',u:['rebanada','rebanadas'],nota:'freezado en rodajas va directo a la tostadora'},
  ricota:{n:'Ricota',grp:'merienda-d',u:['cda','cdas']},
  avena:{n:'Avena',grp:'merienda-d',u:['cda','cdas'],gPorU:10},
  queso:{n:'Queso',grp:'merienda-d',fijo:'unas porciones',nota:'para el comodín'},
  canela:{n:'Canela',grp:'merienda-d',fijo:'que haya'},
  oregano:{n:'Orégano',grp:'merienda-d',fijo:'que haya'}
};
function merOk(set){return set.some(id=>MER[id].tipo==='dulce')&&set.some(id=>MER[id].tipo==='salada');}
// 3 meriendas distintas, al menos una dulce y una salada; lo de la semana pasada pesa menos.
function pickMerienda(avoid,rng){
  // Si sale exactamente lo mismo que la semana pasada, se vuelve a sortear (hasta 5 veces).
  const prevKey=avoid.slice(-MER_N).slice().sort().join();
  let set;for(let t=0;t<5;t++){set=pickMerOnce(avoid,rng);if(set.slice().sort().join()!==prevKey)break;}
  return set;
}
function pickMerOnce(avoid,rng){
  const w=id=>avoid.includes(id)?0.35:1;
  const pick=ids=>wpick(ids.map(id=>({id,w:w(id)})),rng).id;
  const set=[pick(MER_IDS.filter(id=>MER[id].tipo==='salada'))];
  set.push(pick(MER_IDS.filter(id=>MER[id].tipo==='dulce')));
  while(set.length<MER_N)set.push(pick(MER_IDS.filter(id=>!set.includes(id))));
  return set.sort((a,b)=>MER_IDS.indexOf(a)-MER_IDS.indexOf(b));
}
function rerollMerSlot(set,i,avoid,rng){
  const rest=set.filter((_,j)=>j!==i);
  let cand=MER_IDS.filter(id=>!set.includes(id)&&merOk(rest.concat(id)));
  if(!cand.length)return set.slice();
  const out=set.slice();
  out[i]=wpick(cand.map(id=>({id,w:avoid.includes(id)?0.35:1})),rng).id;
  return out;
}
function pickFruta(avoid,rng,exclude){
  let pool=FRUTA_IDS.filter(f=>f!==exclude);
  return wpick(pool.map(f=>({id:f,w:f===avoid?0.3:1})),rng).id;
}
// Cuántas meriendas de cada una: se reparten las de la semana entre las 3.
function merServings(s){
  const N=Math.max(0,s.merDias*s.personas),b=Math.floor(N/MER_N),r=N%MER_N;
  return Array.from({length:MER_N},(_,i)=>b+(i<r?1:0));
}
function computeMerienda(s,w){
  const sv=merServings(s),need={},order=[];
  const add=(k,q)=>{if(!(k in need)){need[k]=0;order.push(k);}need[k]+=q;};
  w.merienda.forEach((id,i)=>{
    const n=sv[i];if(!n)return;
    Object.entries(MER[id].ing).forEach(([k,q])=>{
      if(k==='FRUTA'){if(w.fruta==='frutosrojos')add('frutosrojos',80*n);else add(w.fruta,n);}
      else add(k,q*n);
    });
  });
  // Comodín: queso en porción + pera o manzana verde. Siempre 2 frutas extra.
  const fc=(w.fruta==='manzana'||w.fruta==='pera')?w.fruta:'pera';
  add('queso',0);add(fc,2);
  const items=order.map(k=>{
    const d=MING[k],q=need[k];let texto,aprox='',nota=d.nota||'';
    if(d.fijo)texto=d.fijo;
    else if(d.g&&d.pote){const n=Math.max(1,Math.ceil(q/d.pote-1e-9));texto=n+(n===1?' pote':' potes');aprox='≈ '+fmtG(q)+' en la semana';}
    else if(d.g&&d.bolsa){texto='1 bolsa';aprox='usás ≈ '+fmtG(q);}
    else if(d.g){texto=fmtG(Math.max(d.paso,Math.ceil(q/d.paso-1e-9)*d.paso));}
    else{texto=q+' '+(q===1?d.u[0]:d.u[1]);if(d.gPorU)aprox='≈ '+fmtG(q*d.gPorU);else if(d.aprox)aprox=d.aprox;}
    if(k===fc&&k!=='frutosrojos')nota=(nota?nota+' · ':'')+'incluye 2 para el comodín';
    return{id:'m_'+k,nombre:d.n,texto,aprox,nota,det:'',grupo:d.grp,gCompra:0};
  });
  const uses=k=>w.merienda.reduce((a,id,i)=>a+(MER[id].ing[k]!=null?sv[i]:0),0);
  return{sv,items,bolsitas:uses('avena')-(w.merienda.includes('placa')?sv[w.merienda.indexOf('placa')]:0),
    placa:w.merienda.includes('placa')?sv[w.merienda.indexOf('placa')]:0,pan:uses('pan'),cherry:uses('cherry'),comodinFruta:fc};
}

function pad(n){return String(n).padStart(2,'0');}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
// Domingo de prep al que corresponde la lista: lun–mié = domingo pasado (semana en curso), jue–sáb = domingo que viene.
function prepSunday(now,offset){
  const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const dow=d.getDay();
  const diff=dow===0?0:(dow<=3?-dow:7-dow);
  d.setDate(d.getDate()+diff+(offset||0)*7);
  return d;
}
function fmtG(g){
  g=Math.round(g);
  if(g<1000)return g+' g';
  const k=(g/1000).toFixed(g%1000===0?0:2).replace('.',',').replace(/0$/,'');
  return k+' kg';
}
function shares(pl){
  const sh={asado:0,ensalada:0,verde:0};let tot=0;
  PLATOS.forEach(p=>{const n=Math.max(0,+((pl||{})[p.id])||0);tot+=n;p.c.forEach(k=>{sh[k]+=n/p.c.length;});});
  if(!tot)return{asado:1/3,ensalada:1/3,verde:1/3};
  return{asado:sh.asado/tot,ensalada:sh.ensalada/tot,verde:sh.verde/tot};
}
function isFrozen(w){return w.formato==='congelado'&&!!VEG[w.green].congelable;}
function buy(v,need,frozen,bolsaG){
  if(frozen){
    const n=Math.max(1,Math.ceil(need/bolsaG-1e-9));
    return{texto:n+' '+(n===1?'bolsa':'bolsas')+' de '+bolsaG+' g',aprox:'≈ '+fmtG(n*bolsaG),gCompra:n*bolsaG,nota:'lo que sobra queda en el freezer'};
  }
  if(v.modo==='unidad'){
    const n=Math.max(1,Math.ceil(need/v.unitG-0.2-1e-9));
    const g=n*v.unitG;
    return{texto:n+' '+(n===1?v.u[0]:v.u[1]),aprox:'≈ '+fmtG(g),gCompra:g,nota:''};
  }
  const g=Math.max(v.paso,Math.ceil(need/v.paso-1e-9)*v.paso);
  let aprox='';
  if(v.unitG&&v.u){const n=Math.max(1,Math.round(g/v.unitG));aprox='≈ '+n+' '+(n===1?v.u[0]:v.u[1]);}
  return{texto:fmtG(g),aprox,gCompra:g,nota:''};
}
function computePlan(s,w,month){
  const total=s.personas*s.comidas*s.dias*s.gPlato;
  const sh=shares(s.platos);
  const cooked={asado:total*sh.asado,ensalada:total*sh.ensalada,verde:total*sh.verde};
  const raw={},parts={},first={},order=[];
  const add=(id,g,tag)=>{
    if(!(id in raw)){raw[id]=0;parts[id]=[];first[id]=tag;order.push(id);}
    raw[id]+=g;parts[id].push([tag,Math.round(g)]);
  };
  const hs=w.horno.reduce((a,id)=>a+HORNO_POOL[id],0);
  if(cooked.asado>0)w.horno.forEach(id=>add(id,cooked.asado*(HORNO_POOL[id]/hs)/VEG[id].rinde,'horno'));
  const SAL=SALADS[w.salad];
  if(cooked.ensalada>0)Object.keys(SAL.mix).forEach(id=>add(id,cooked.ensalada*SAL.mix[id]/VEG[id].rinde,'ensalada'));
  const frozen=isFrozen(w),gv=VEG[w.green];
  if(cooked.verde>0)add(w.green,cooked.verde/(frozen?gv.rindeCong:gv.rinde),'verde');
  const items=order.map(id=>{
    const v=VEG[id],need=raw[id],fz=(id===w.green&&frozen),b=buy(v,need,fz,s.bolsaG);
    let nota=b.nota;
    if(!nota&&id==='esparragos'&&b.gCompra>=900)nota='es bastante cantidad: podés bajar las comidas con verde en Ajustes';
    if(!nota){
      if(b.gCompra<need*0.93)nota='justo: cubre ~'+Math.round(b.gCompra/need*100)+'% de lo calculado';
      else if(b.gCompra-need>=100&&b.gCompra>need*1.2)nota='sobran ~'+fmtG(b.gCompra-need)+' (crudos): usalos en otra comida';
    }
    return{id,nombre:fz?v.nombreCong:v.nombre,need:Math.round(need),parts:parts[id],texto:b.texto,aprox:b.aprox,gCompra:b.gCompra,nota,
      temp:v.temp[month],congelado:fz,grupo:first[id]==='horno'?'horno':(first[id]==='ensalada'?'ensalada':'verde')};
  });
  const cnt=PLATOS.map(p=>Math.max(0,+((s.platos||{})[p.id])||0));
  const sumC=cnt.reduce((a,b)=>a+b,0),N=s.personas*s.comidas*s.dias;
  const platos=PLATOS.map((p,i)=>({id:p.id,nombre:p.nombre,c:p.c,n:sumC?cnt[i]*N/sumC:0,g:s.gPlato/p.c.length}));
  return{total,cooked,platos,comidas:N,sumaPlatos:sumC,items,compraG:items.reduce((a,i)=>a+i.gCompra,0)};
}
function wpick(items,rng){
  const t=items.reduce((a,b)=>a+b.w,0);let r=rng()*t;
  for(const it of items){r-=it.w;if(r<=0)return it;}
  return items[items.length-1];
}
const lvlW=l=>l===2?3:(l===1?1.2:0.5);
// opts: {fuera, formato}. Congelado: las 4 congelables salen siempre; espárragos solo si están en temporada.
function pickGreen(month,recent,opts,rng,exclude){
  const all=GREENS.map(id=>({id,lvl:VEG[id].temp[month],cong:!!VEG[id].congelable}));
  const frozenMode=opts.formato==='congelado';
  let c=all.filter(x=>frozenMode?(x.cong||x.lvl>0||opts.fuera):(x.lvl>0||opts.fuera));
  if(!c.length)c=all;
  let pool=c.filter(x=>!recent.includes(x.id)&&x.id!==exclude);
  if(!pool.length)pool=c.filter(x=>x.id!==exclude);
  if(!pool.length)pool=c;
  return wpick(pool.map(x=>({id:x.id,w:(frozenMode&&x.cong)?1:lvlW(x.lvl)})),rng).id;
}
function pickHorno(month,avoid,rng){
  const ids=Object.keys(HORNO_POOL);
  const cand=ids.map(id=>({id,lvl:VEG[id].temp[month]}));
  let pool=cand.filter(x=>x.lvl>0);
  if(pool.length<HORNO_N)pool=cand;
  const items=pool.map(x=>({id:x.id,w:(x.lvl===2?3:(x.lvl===1?1.2:0.3))*(avoid.includes(x.id)?0.4:1)}));
  const chosen=[];
  while(chosen.length<HORNO_N&&items.length){
    const it=wpick(items,rng);chosen.push(it.id);items.splice(items.indexOf(it),1);
  }
  return chosen.sort((a,b)=>ids.indexOf(a)-ids.indexOf(b));
}
function pickSalad(month,last,rng,exclude){
  let items=Object.keys(SALADS).filter(k=>k!==exclude).map(k=>{
    const l=VEG[SALADS[k].key].temp[month];
    return{id:k,w:(l===2?3:(l===1?1.2:0.1))*(k===last?0.35:1)};
  });
  if(!items.length)items=Object.keys(SALADS).map(k=>({id:k,w:1}));
  return wpick(items,rng).id;
}
function pickIdx(n,avoid,rng){
  let pool=[];for(let i=0;i<n;i++)if(!avoid.includes(i))pool.push(i);
  if(!pool.length)for(let i=0;i<n;i++)pool.push(i);
  return pool[Math.floor(rng()*pool.length)];
}
function prevWeek(st,key){
  const ks=Object.keys(st.weeks).filter(k=>k<key).sort();
  return ks.length?st.weeks[ks[ks.length-1]]:null;
}
function recentGreens(st,key){
  return Object.keys(st.weeks).filter(k=>k<key&&st.weeks[k].green).sort().slice(-2).map(k=>st.weeks[k].green);
}
function ensureWeek(st,key,month,rng){
  let w=st.weeks[key];
  if(!w)w=st.weeks[key]={};
  if(!w.checks)w.checks={};
  const prev=prevWeek(st,key),s=st.settings;
  if(!w.green||!VEG[w.green])w.green=pickGreen(month,recentGreens(st,key),{fuera:s.fuera,formato:s.verdeFormato},rng,null);
  if(w.green==='esparragos')w.formato='fresco';else if(!w.formato)w.formato=s.verdeFormato;
  if(!w.salad||!SALADS[w.salad])w.salad=pickSalad(month,prev&&prev.salad,rng,null);
  if(!Array.isArray(w.horno)||!w.horno.length||w.horno.some(id=>!(id in HORNO_POOL)))w.horno=pickHorno(month,(prev&&prev.horno)||[],rng);
  if(w.aderezo==null)w.aderezo=pickIdx(ADEREZOS.length,prev&&prev.aderezo!=null?[prev.aderezo]:[],rng);
  if(w.condimento==null)w.condimento=pickIdx(CONDIMENTOS.length,prev&&prev.condimento!=null?[prev.condimento]:[],rng);
  if(!Array.isArray(w.merienda)||w.merienda.length!==MER_N||w.merienda.some(id=>!MER[id])||new Set(w.merienda).size!==MER_N)
    w.merienda=pickMerienda((prev&&prev.merienda)||[],rng);
  if(!w.fruta||!FRUTAS[w.fruta])w.fruta=pickFruta(prev&&prev.fruta,rng,null);

}
function clearMerChecks(w){Object.keys(w.checks).forEach(k=>{if(k.indexOf('c_m_')===0||k.indexOf('mp_')===0)delete w.checks[k];});}
function reroll(st,key,month,slot,rng){
  const w=st.weeks[key],s=st.settings,prev=prevWeek(st,key);
  const all=slot==='all';
  if(slot==='green'||all){
    w.green=pickGreen(month,recentGreens(st,key),{fuera:s.fuera,formato:s.verdeFormato},rng,w.green);
    w.formato=w.green==='esparragos'?'fresco':s.verdeFormato;
  }
  if(slot==='salad'||all)w.salad=pickSalad(month,prev&&prev.salad,rng,w.salad);
  if(slot==='horno'||all)w.horno=pickHorno(month,((prev&&prev.horno)||[]).concat(w.horno),rng);
  if(slot==='aderezo'||all)w.aderezo=pickIdx(ADEREZOS.length,[w.aderezo].concat(prev&&prev.aderezo!=null?[prev.aderezo]:[]),rng);
  if(slot==='condimento'||all)w.condimento=pickIdx(CONDIMENTOS.length,[w.condimento].concat(prev&&prev.condimento!=null?[prev.condimento]:[]),rng);
  if(['green','salad','horno','all'].includes(slot))w.checks={};
  const pm=(prev&&prev.merienda)||[];
  if(slot==='merienda'||all){w.merienda=pickMerienda(pm.concat(w.merienda),rng);w.fruta=pickFruta(w.fruta,rng,w.fruta);clearMerChecks(w);}
  if(/^mer[0-9]$/.test(slot)){w.merienda=rerollMerSlot(w.merienda,+slot.slice(3),pm,rng);clearMerChecks(w);}

}
function load(){

    '<select data-c="fruta" aria-label="Elegir fruta">'+fOpts+'</select></div>'+dice('fruta')+'</div>';
  const pasos=[];
  if(m.bolsitas>0)pasos.push({id:'mp_bolsitas',t:'Armar '+m.bolsitas+' bolsitas de avena',d:'2 cucharadas soperas en cada frasquito o bolsita. En la semana solo la volcás: no medís nada.'});
  if(m.placa>0)pasos.push({id:'mp_placa',t:'Armar la placa de yogur helado',d:'Mezclar '+m.placa+(m.placa===1?' yogur':' yogures')+' con '+(m.placa*2)+' cdas de avena. Esparcir en una bandeja con papel manteca (~1 cm), frutos rojos arriba y al freezer 3–4 h. Partir en '+m.placa+' trozos y guardarlos en una bolsa en el freezer.'});
  if(m.pan>0)pasos.push({id:'mp_pan',t:'Freezar el pan en rodajas',d:'Si no viene cortado, cortalo. Del freezer va directo a la tostadora.'});
  if(m.cherry>0)pasos.push({id:'mp_cherry',t:'Lavar los tomates cherry',d:'Bien secos, en un tupper con papel absorbente: listos para agarrar.'});
  pasos.push({id:'mp_queso',t:'Cortar el queso en porciones',d:'Una porción por día de fiaca. Así no picás del bloque.'});
  pasos.push({id:'mp_fruta',t:'Lavar la fruta y dejarla a la vista',d:'Adelante en la heladera o en la mesada: lo que se ve primero es lo que se come.'});
  const list=pasos.map(x=>'<label class="chk'+(done[x.id]?' done':'')+'"><input type="checkbox" data-c="chk" data-id="'+x.id+'"'+(done[x.id]?' checked':'')+'><div><div class="t">'+x.t+'</div><div class="d">'+x.d+'</div></div></label>').join('');
  return '<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:4px"><h2 style="margin:0">Merienda de la semana</h2><button class="btn pri" data-a="reroll" data-v="merienda">Sortear</button></div>'+
    '<div class="muted">Todo sin cocinar. '+s.merDias*s.personas+' meriendas repartidas entre las 3.</div>'+slots+fruta+'</div>'+
    '<div class="card"><h2>Comodín para los días de fiaca</h2><div><b>Queso en porción + '+(m.comodinFruta==='manzana'?'manzana verde':'pera')+'</b></div>'+
    '<div class="dd" style="margin-top:4px">Le falta el hidrato que pide Luli: si podés, sumale una tostada. Mejor esto que saltearla.</div></div>'+
    '<div class="card"><h2>Domingo, 10 minutos</h2><div class="muted" style="margin-bottom:6px">Nada de hornallas: solo dejar todo listo para agarrar.</div>'+list+'</div>'+
    '<div class="card"><h2>Para tener en cuenta</h2>'+
    '<div>• <b>Sin azúcar:</b> yogur natural y hummus, siempre mirando la etiqueta.</div>'+
    '<div>• <b>Pan, quesos, ricota y hummus:</b> tu lista de candidiasis no los prohíbe ni los incluye. Van en poca cantidad; consultalo con tu médica.</div>'+
    '<div>• Las compras de la merienda están en <b>Comprar</b>, junto con las verduras.</div></div>';
}
function vComprar(c){
  const p=c.plan,done=c.w.checks;
  const groups=[['horno','Para el horno'],['ensalada','Ensalada'],['verde','Verde de la semana'],['merienda','Merienda'],['merienda-d','Merienda · revisá si tenés']];
  const n=p.items.filter(i=>done['c_'+i.id]).length;
  let html='<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Lista de compras</h2><span class="muted">'+n+' de '+p.items.length+'</span></div>'+
    '<div class="muted" style="margin:4px 0 10px">Verduras: total aprox. '+PV.fmtG(p.compraG)+', redondeado para que no sobre de más.</div>';
  groups.forEach(gr=>{
    const its=p.items.filter(i=>i.grupo===gr[0]);
    if(!its.length)return;
    html+='<div class="grp">'+gr[1]+'</div>';
    its.forEach(i=>{
      const parts=i.det!=null?i.det:i.parts.map(x=>x[0]+' '+PV.fmtG(x[1])).join(' + ');
      const desc=[(i.congelado||i.temp==null?'':badge(i.temp)+' ')+parts,i.nota].filter(Boolean).join(' · ');
      html+='<label class="chk'+(done['c_'+i.id]?' done':'')+'"><input type="checkbox" data-c="chk" data-id="c_'+i.id+'"'+(done['c_'+i.id]?' checked':'')+'>'+
      '<div><div class="t">'+i.nombre+'</div><div class="d">'+desc+'</div></div>'+
      '<div class="q">'+i.texto+(i.aprox?'<div class="d" style="font-weight:400">'+i.aprox+'</div>':'')+'</div></label>';
    });
  });
  html+='<div class="row" style="margin-top:16px"><button class="btn pri" data-a="copy">Copiar lista</button><button class="btn" data-a="uncheck">Destildar todo</button></div></div>'+
    '<div class="muted" style="margin:10px 4px">Los rendimientos (cuánto queda cocido de lo que comprás) son estimados. Si ves que siempre sobra o falta, ajustá “comidas por día” o el armado de los platos en Ajustes. Para el verde congelado, cambiá el tamaño de bolsa en Ajustes si el de tu súper es otro.</div>';
  return html;
}
function vPrep(c){
  const done=c.w.checks,s=st.settings,fz=PV.isFrozen(c.w);
  const list=PV.steps(c.w,s).map(x=>'<label class="chk'+(done[x.id]?' done':'')+'"><input type="checkbox" data-c="chk" data-id="'+x.id+'"'+(done[x.id]?' checked':'')+'><div><div class="t">'+x.t+'</div><div class="d">'+x.d+'</div></div></label>').join('');
  let tips='<div>• <b>Ensalada:</b> con la lechuga bien seca y papel absorbente, dura unos 5 días.</div>'+
    '<div>• <b>Cocidos:</b> guía general de sobras, 3–4 días en la heladera.</div>';
  if(s.dias>4){
    if(fz)tips+='<div class="warn">Estás cubriendo '+s.dias+' días. Como el verde es congelado, no hace falta cocinarlo todo el domingo: cociná lo de los primeros 3–4 días y dejá el resto en el freezer; a mitad de semana lo cocinás directo en pocos minutos. Con la bandeja del horno, congelá la mitad en porciones y descongelala en la heladera la noche anterior. La lechuga no se congela: si te falta al final de la semana, reponela a mitad de semana.</div>';
    else tips+='<div class="warn">Estás cubriendo '+s.dias+' días. Dejá en la heladera lo de los primeros 3–4 días y congelá el resto en porciones (descongelá en la heladera la noche anterior). La lechuga no se congela: si te falta al final de la semana, reponela a mitad de semana.</div>';
  }
  return '<div class="card"><h2>Domingo, paso a paso</h2><div class="muted" style="margin-bottom:6px">Tiempos aproximados; si el paquete congelado dice otra cosa, seguí el del paquete.</div>'+list+'</div>'+
    '<div class="card"><h2>Cuánto dura</h2>'+tips+'</div>';
}
function fld(label,k,val,min,max,step){
  return '<div class="fld"><div>'+label+'</div><input type="number" inputmode="decimal" data-c="set" data-k="'+k+'" value="'+val+'" min="'+min+'" max="'+max+'" step="'+(step||1)+'"></div>';
}
function vAjustes(){
  const s=st.settings,pl=s.platos,N=s.personas*s.comidas*s.dias,sum=PV.PLATOS.reduce((a,x)=>a+(+pl[x.id]||0),0);
  const hist=Object.keys(st.weeks).filter(k=>st.weeks[k].green).sort().slice(-6).reverse()
    .map(k=>{const w=st.weeks[k];return '<div class="d" style="padding:3px 0">'+k+' · '+VEG[w.green].nombre+(w.salad&&SALADS[w.salad]?' · '+SALADS[w.salad].nombre:'')+'</div>';}).join('')||'<div class="muted">Todavía no hay semanas.</div>';
  return '<div class="card"><h2>Cantidades</h2>'+
    fld('Personas','personas',s.personas,1,6)+fld('Comidas con verdura por día','comidas',s.comidas,1,3)+
    fld('Días que cubre el prep','dias',s.dias,1,7)+fld('Verdura por comida (g)','gPlato',s.gPlato,100,400,10)+'</div>'+
    '<div class="card"><h2>Armado de los platos</h2><div class="muted">De las '+N+' comidas de la semana, cuántas son de cada tipo. Si un plato lleva dos o tres tuppers, la verdura se reparte en partes iguales.</div>'+
    PV.PLATOS.map(x=>fld(x.nombre,'platos.'+x.id,pl[x.id],0,99)).join('')+
    (sum!==N?'<div class="warn">Sumaste '+sum+' de '+N+' comidas: la app mantiene la proporción y la ajusta a '+N+'.</div>':'')+'</div>'+
    '<div class="card"><h2>Merienda</h2>'+fld('Meriendas por semana (días)','merDias',s.merDias,1,7)+
    '<div class="muted">Se reparten entre las 3 meriendas de la semana; también se multiplica por personas.</div></div>'+
    '<div class="card"><h2>Verde</h2>'+
    '<div class="fld"><div>Formato por defecto</div><select data-c="fmt"><option value="congelado"'+(s.verdeFormato==='congelado'?' selected':'')+'>Congelado</option><option value="fresco"'+(s.verdeFormato==='fresco'?' selected':'')+'>Fresco</option></select></div>'+
    fld('Tamaño de bolsa congelada (g)','bolsaG',s.bolsaG,200,1000,50)+
    '<label class="chk"><input type="checkbox" data-c="fuera"'+(s.fuera?' checked':'')+'><div><div class="t">Incluir verduras fuera de estación</div><div class="d">Si está apagado, el sorteo de verdes frescos solo toma las de estación o disponibles.</div></div></label></div>'+
    '<div class="card"><h2>Últimas semanas</h2>'+hist+
    '<div class="muted" style="margin-top:10px">Las temporadas son para la zona central de Argentina y están en el código, por si querés corregirlas.</div></div>';
}
function render(){
  const c=ctx();
  const views={semana:vSemana,merienda:vMerienda,comprar:vComprar,prep:vPrep,ajustes:vAjustes};
  const tabs=[['semana','🥬','Semana'],['merienda','🍐','Merienda'],['comprar','🛒','Comprar'],['prep','🔪','Prep'],['ajustes','⚙️','Ajustes']];
  app.innerHTML=header(c)+views[ui.tab](c)+
    '<nav><div class="in">'+tabs.map(t=>'<button data-a="tab" data-v="'+t[0]+'" class="'+(ui.tab===t[0]?'on':'')+'"><span class="ic">'+t[1]+'</span>'+t[2]+'</button>').join('')+'</div></nav>';
}
function listText(c){
  const ln=i=>'- '+i.nombre+': '+i.texto+(i.aprox?' ('+i.aprox+')':'');
  const veg=c.plan.items.filter(i=>i.grupo.indexOf('merienda')!==0),me=c.plan.items.filter(i=>i.grupo==='merienda'),md=c.plan.items.filter(i=>i.grupo==='merienda-d');
  return 'Compras para el '+lab(c.d)+':\n'+veg.map(ln).join('\n')+
    (me.length?'\n\nMerienda:\n'+me.map(ln).join('\n'):'')+(md.length?'\n\nRevisar si hay:\n'+md.map(ln).join('\n'):'');
}
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,c=ctx();
  if(a==='tab'){ui.tab=t.dataset.v;window.scrollTo(0,0);}
  else if(a==='offset'){ui.offset=+t.dataset.v;}
  else if(a==='reroll'){PV.reroll(st,c.key,c.month,t.dataset.v,Math.random);PV.save(st);}
  else if(a==='formato'){if(c.w.green!=='esparragos'){c.w.formato=t.dataset.v;c.w.checks={};PV.save(st);}}
  else if(a==='uncheck'){c.w.checks={};PV.save(st);}
  else if(a==='copy'){
    const txt=listText(c);
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('Lista copiada'),()=>toast('No se pudo copiar'));}
    else toast('No se pudo copiar');
    return;
  }
  render();
});
app.addEventListener('change',e=>{
  const t=e.target.closest('[data-c]');if(!t)return;
  const k=t.dataset.c,c=ctx();
  if(k==='chk'){c.w.checks[t.dataset.id]=t.checked;PV.save(st);}
  else if(k==='green'){
    c.w.green=t.value;
    c.w.formato=t.value==='esparragos'?'fresco':st.settings.verdeFormato;
    c.w.checks={};PV.save(st);
  }
  else if(k==='salad'){c.w.salad=t.value;c.w.checks={};PV.save(st);}
  else if(k==='mer'){
    const i=+t.dataset.i,m=c.w.merienda.slice(),j=m.indexOf(t.value);
    if(j>=0&&j!==i)m[j]=m[i];
    m[i]=t.value;c.w.merienda=m;PV.clearMerChecks(c.w);PV.save(st);
  }
  else if(k==='fruta'){c.w.fruta=t.value;PV.clearMerChecks(c.w);PV.save(st);}
  else if(k==='fmt'){st.settings.verdeFormato=t.value;PV.save(st);}
  else if(k==='fuera'){st.settings.fuera=t.checked;PV.save(st);}
  else if(k==='set'){
    const key=t.dataset.k;let v=parseFloat(t.value);
    const isP=key.indexOf('platos.')===0,pid=key.split('.')[1];
    const lim=isP?[0,99]:{personas:[1,6],comidas:[1,3],dias:[1,7],gPlato:[100,400],bolsaG:[200,1000],merDias:[1,7]}[key];
    if(isNaN(v))v=isP?st.settings.platos[pid]:st.settings[key];
    v=Math.min(lim[1],Math.max(lim[0],Math.round(v)));
    if(isP)st.settings.platos[pid]=v;else st.settings[key]=v;
    const pl=st.settings.platos;
    if(PV.PLATOS.every(x=>!(pl[x.id]>0))){pl.h=pl.e=pl.v=1;}
    PV.save(st);
  }
  render();
});
render();
})();
</script>
</body>
</html>
